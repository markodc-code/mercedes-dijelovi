<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercedes dijelovi</title>
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --bg: #f3f4f6; --card: #ffffff; --ink: #16181d; --muted: #6b7280; --line: #e3e5ea;
  --accent: #1f6feb; --accent-ink: #fff; --ok: #12805c; --warn: #b45309; --bad: #c62828;
  --chip: #eef1f5; --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1115; --card: #181b21; --ink: #e8eaee; --muted: #9aa1ad; --line: #2a2e36;
    --accent: #4c8dff; --chip: #232730; --ok: #34c08a; --warn: #f0a33a; --bad: #ff6b6b; --shadow: none; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 10; background: #16181d; color: #fff;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 0; }
header .top { display: flex; align-items: center; gap: 10px; max-width: 1100px; margin: 0 auto; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; font-weight: 650; }
header h1 small { color: #9aa1ad; font-weight: 400; margin-left: 6px; }
nav { display: flex; gap: 4px; max-width: 1100px; margin: 8px auto 0; overflow-x: auto; }
nav a { color: #c7ccd6; text-decoration: none; padding: 9px 14px; border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 550; }
nav a.on { color: #fff; border-color: var(--accent); }
main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 80px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: ui-monospace, Consolas, monospace; letter-spacing: .5px; }
h2 { font-size: 20px; margin: 4px 0 12px; }
h3 { font-size: 16px; margin: 0 0 8px; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 8px 14px; border-radius: 9px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.f { display: block; }
label.f span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.checks { display: grid; gap: 6px 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.checks label { display: flex; gap: 8px; align-items: center; }
.checks input { width: auto; }
.vinbox { display: flex; gap: 8px; }
.vinbox input { font-family: ui-monospace, Consolas, monospace; font-size: 18px; letter-spacing: 1.5px; text-transform: uppercase; }
table.info { border-collapse: collapse; width: 100%; }
table.info td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.info td:first-child { color: var(--muted); width: 42%; }
.err { color: var(--bad); }
.ok { color: var(--ok); }
.cars { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.carcard { cursor: pointer; display: flex; gap: 12px; }
.carcard:hover { border-color: var(--accent); }
.thumb { width: 84px; height: 64px; border-radius: 8px; background: var(--chip) center/cover no-repeat; flex: none;
  display: grid; place-items: center; color: var(--muted); font-size: 26px; }
.stats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.stat { background: var(--chip); border-radius: 10px; padding: 8px 12px; }
.stat b { display: block; font-size: 18px; }
.stat span { font-size: 12.5px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 5px 11px; border-radius: 999px; background: var(--chip); border: 1px solid transparent; cursor: pointer; font-size: 13.5px; }
.chip.on { background: var(--accent); color: #fff; }
details.grp { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; }
details.grp > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-weight: 600; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary .cnt { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 13px; }
details.grp > summary::after { content: '▸'; color: var(--muted); transition: transform .15s; }
details.grp[open] > summary::after { transform: rotate(90deg); }
.part { display: grid; grid-template-columns: 1fr 128px 96px; gap: 8px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--line); }
.part .nm { cursor: pointer; min-width: 0; }
.part .nm b { font-weight: 500; }
.part .nm:hover b { color: var(--accent); text-decoration: underline; }
.part select, .part input { padding: 5px 7px; font-size: 13.5px; }
.part.s-Prodano .nm b { color: var(--muted); text-decoration: line-through; }
.addpart { display: flex; gap: 8px; padding: 8px 14px 12px; border-top: 1px solid var(--line); }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
.b-Prodano { background: #dcfce7; color: #166534; } .b-Na-polici { background: #dbeafe; color: #1e40af; }
.b-Skinuto { background: #fef3c7; color: #92400e; } .b-Oštećeno, .b-Otpad { background: #fee2e2; color: #991b1b; }
@media (prefers-color-scheme: dark) {
  .b-Prodano { background: #14532d; color: #bbf7d0; } .b-Na-polici { background: #1e3a8a; color: #bfdbfe; }
  .b-Skinuto { background: #78350f; color: #fde68a; } .b-Oštećeno, .b-Otpad { background: #7f1d1d; color: #fecaca; }
}
.res { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.res:hover b { color: var(--accent); }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
table.t th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
.scroll { overflow-x: auto; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photo { position: relative; width: 92px; height: 92px; border-radius: 8px; background: var(--chip) center/cover; cursor: zoom-in; }
.photo button { position: absolute; top: 3px; right: 3px; padding: 0 6px; font-size: 13px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; border: 0; }
.addphoto { width: 92px; height: 92px; border: 2px dashed var(--line); border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--muted); font-size: 13px; text-align: center; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.modal .box { background: var(--card); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .modal { align-items: center; } .modal .box { border-radius: 16px; } }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 60; display: grid; place-items: center; cursor: zoom-out; }
.lightbox img { max-width: 96vw; max-height: 94vh; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #16181d; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 70; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
@media (max-width: 560px) {
  .part { grid-template-columns: 1fr 112px; }
  .part input.price { grid-column: 2; }
  .part .nm { grid-row: span 2; }
}
@media print {
  header, .noprint, .addpart, button { display: none !important; }
  body, .card, details.grp { background: #fff; color: #000; box-shadow: none; }
  .part { grid-template-columns: 1fr 120px 80px; break-inside: avoid; }
  .part select, .part input { border: 0; appearance: none; padding: 0; }
}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Mercedes dijelovi <small>rastavljanje i prodaja</small></h1><span id="sync" class="small" style="margin-left:auto;color:#9aa1ad"></span></div>
  <nav>
    <a href="#auti" data-v="auti">Auti</a>
    <a href="#novi" data-v="novi">+ Novi auto</a>
    <a href="#trazi" data-v="trazi">Pretraga dijelova</a>
    <a href="#zarada" data-v="zarada">Zarada</a>
    <a href="#postavke" data-v="postavke">Kopija i postavke</a>
  </nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<script src="db.js"></script>
<script src="vin.js"></script>
<script src="dijelovi.js"></script>
<script src="app.js"></script>
</body>
</html>
